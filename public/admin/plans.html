<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Plans</title>
  <link rel="stylesheet" href="/admin/assets/style.css" />
  <style>
    label { display: block; color: var(--muted); font-size: 0.88rem; }
    label .input { display: block; width: 100%; margin-top: 4px; font-size: 1rem; }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .head h3 { margin: 0; }
    .price { font-size: 1.05rem; }
    .price s { color: var(--muted); margin-right: 6px; }
    .tag { display: inline-block; font-size: 0.78rem; padding: 2px 8px; border-radius: 999px; background: #2a3546; color: var(--accent); margin-left: 6px; }
    .tag.off { background: #3a2a2e; color: var(--danger); }
    .sub { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
    .row-actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
    .ok { color: #8bd5a0; }
    .check { display: flex; align-items: center; gap: 6px; margin-top: 22px; color: var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>💰 แพ็กเกจ &amp; ราคา Pro</h1>
    <p><a href="/admin">Dashboard</a> · <a href="/admin/promos">Promo codes</a></p>
    <p class="muted" style="color:var(--muted)">ลูกค้าจ่ายครั้งเดียวผ่าน QR พร้อมเพย์ ได้ Pro ตามจำนวนวัน · ราคาต่ำสุด ฿10 · ราคาที่เปลี่ยนมีผลกับการกดจ่ายครั้งถัดไปทันที</p>
    <div id="list">Loading...</div>

    <form class="card" id="newPlan" novalidate>
      <h3 style="margin-top:0">➕ เพิ่มแพ็กเกจ</h3>
      <div class="grid">
        <label>รหัส (a–z, 0–9, -)
          <input class="input" name="code" placeholder="เช่น 2m" maxlength="20" required />
        </label>
        <label>ชื่อที่แสดง
          <input class="input" name="labelTh" placeholder="เช่น 2 เดือน" maxlength="40" required />
        </label>
        <label>จำนวนวัน
          <input class="input" name="days" type="number" min="1" max="3650" step="1" required />
        </label>
        <label>ราคา (บาท)
          <input class="input" name="priceThb" type="number" min="10" step="1" required />
        </label>
        <label>ลำดับ (น้อยขึ้นก่อน)
          <input class="input" name="sortOrder" type="number" step="1" value="50" />
        </label>
      </div>
      <div class="row-actions">
        <button class="btn" type="submit">เพิ่มแพ็กเกจ</button>
        <span class="msg" role="status"></span>
      </div>
    </form>
  </div>

  <script>
    async function api(path, opt) {
      const res = await fetch(path, { credentials: 'include', ...opt, headers: { 'Content-Type': 'application/json', ...(opt?.headers || {}) } });
      if (res.status === 401) { location.href = '/admin/login'; throw new Error('auth'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(Array.isArray(data.message) ? data.message.join(', ') : (data.message || 'error'));
      return data;
    }
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const baht = (n) => '฿' + Number(n).toLocaleString('th-TH');
    // datetime-local <-> ISO (browser local time, i.e. Bangkok for admins)
    const toLocalInput = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };
    const fromLocalInput = (v) => (v ? new Date(v).toISOString() : null);
    const intOrNull = (v) => {
      const t = String(v).trim();
      if (t === '') return null;
      const n = Number(t);
      return Number.isInteger(n) ? n : NaN;
    };

    function priceHtml(p) {
      const pr = p.priced;
      const discount = pr.discountActive
        ? `<s>${baht(pr.priceThb)}</s><b>${baht(pr.finalPriceThb)}</b><span class="tag">${esc(pr.discountLabel || 'ส่วนลด')}</span>`
        : `<b>${baht(pr.finalPriceThb)}</b>`;
      const off = p.active ? '' : '<span class="tag off">ปิดขาย</span>';
      return `<span class="price">${discount}</span> · ${p.days} วัน · ≈${baht(pr.perMonthThb)}/เดือน ${off}`;
    }

    function planCard(p) {
      return `
      <form class="card" data-id="${esc(p.id)}" novalidate>
        <div class="head">
          <h3>${esc(p.labelTh)} <span style="color:var(--muted);font-size:.85rem">(${esc(p.code)})</span></h3>
          <div>${priceHtml(p)}</div>
        </div>
        <div class="grid" style="margin-top:10px">
          <label>ชื่อที่แสดง <input class="input" name="labelTh" value="${esc(p.labelTh)}" maxlength="40" /></label>
          <label>จำนวนวัน <input class="input" name="days" type="number" min="1" max="3650" step="1" value="${p.days}" /></label>
          <label>ราคาเต็ม (บาท) <input class="input" name="priceThb" type="number" min="10" step="1" value="${p.priceThb}" /></label>
          <label>ลำดับ <input class="input" name="sortOrder" type="number" step="1" value="${p.sortOrder}" /></label>
          <label class="check"><input type="checkbox" name="active" ${p.active ? 'checked' : ''} /> เปิดขาย</label>
        </div>
        <div class="sub">
          <div class="grid">
            <label>ส่วนลด
              <select class="input" name="discountType">
                <option value="NONE" ${p.discountType === 'NONE' ? 'selected' : ''}>ไม่มี</option>
                <option value="PERCENT" ${p.discountType === 'PERCENT' ? 'selected' : ''}>ลดเป็น %</option>
                <option value="AMOUNT" ${p.discountType === 'AMOUNT' ? 'selected' : ''}>ลดเป็นบาท</option>
              </select>
            </label>
            <label>มูลค่าส่วนลด <input class="input" name="discountValue" type="number" min="1" step="1" value="${p.discountType === 'NONE' ? '' : p.discountValue}" /></label>
            <label>ป้ายโปร <input class="input" name="discountLabel" maxlength="40" placeholder="เช่น โปรเปิดตัว" value="${esc(p.discountLabel || '')}" /></label>
            <label>เริ่ม (ว่าง = ทันที) <input class="input" name="discountStartsAt" type="datetime-local" value="${toLocalInput(p.discountStartsAt)}" /></label>
            <label>สิ้นสุด (ว่าง = ไม่หมด) <input class="input" name="discountEndsAt" type="datetime-local" value="${toLocalInput(p.discountEndsAt)}" /></label>
          </div>
        </div>
        <div class="row-actions">
          <button class="btn" type="submit">บันทึก</button>
          <span class="msg" role="status"></span>
        </div>
      </form>`;
    }

    function readPlanForm(form) {
      const f = form.elements;
      const discountType = f.discountType.value;
      const body = {
        labelTh: f.labelTh.value.trim(),
        days: intOrNull(f.days.value),
        priceThb: intOrNull(f.priceThb.value),
        sortOrder: intOrNull(f.sortOrder.value) ?? 0,
        active: f.active.checked,
        discountType,
      };
      if (discountType !== 'NONE') {
        body.discountValue = intOrNull(f.discountValue.value);
        body.discountLabel = f.discountLabel.value.trim() || null;
        body.discountStartsAt = fromLocalInput(f.discountStartsAt.value);
        body.discountEndsAt = fromLocalInput(f.discountEndsAt.value);
      }
      return body;
    }

    async function load() {
      const plans = await api('/admin/api/plans');
      const list = document.getElementById('list');
      list.innerHTML = plans.length ? plans.map(planCard).join('') : '<div class="card">ยังไม่มีแพ็กเกจ</div>';
      list.querySelectorAll('form[data-id]').forEach((form) => {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const msg = form.querySelector('.msg');
          const btn = form.querySelector('button');
          msg.className = 'msg'; msg.textContent = '';
          btn.disabled = true;
          try {
            await api('/admin/api/plans/' + form.dataset.id, { method: 'PATCH', body: JSON.stringify(readPlanForm(form)) });
            await load();
          } catch (err) {
            if (err.message === 'auth') return;
            msg.className = 'msg err'; msg.textContent = err.message;
            btn.disabled = false;
          }
        });
      });
    }

    document.getElementById('newPlan').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const f = form.elements;
      const msg = form.querySelector('.msg');
      msg.className = 'msg'; msg.textContent = '';
      try {
        await api('/admin/api/plans', {
          method: 'POST',
          body: JSON.stringify({
            code: f.code.value.trim().toLowerCase(),
            labelTh: f.labelTh.value.trim(),
            days: intOrNull(f.days.value),
            priceThb: intOrNull(f.priceThb.value),
            sortOrder: intOrNull(f.sortOrder.value) ?? 0,
          }),
        });
        form.reset();
        msg.className = 'msg ok'; msg.textContent = 'เพิ่มแล้ว';
        load();
      } catch (err) {
        if (err.message !== 'auth') { msg.className = 'msg err'; msg.textContent = err.message; }
      }
    });

    load().catch((e) => { document.getElementById('list').textContent = e.message; });
  </script>
</body>
</html>
