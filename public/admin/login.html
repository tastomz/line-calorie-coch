<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="/admin/assets/style.css" />
</head>
<body>
  <div class="wrap">
    <h1>Admin</h1>
    <div class="card">
      <input class="input" id="u" placeholder="username" style="width:100%;margin-bottom:8px" />
      <input class="input" id="p" type="password" placeholder="password" style="width:100%;margin-bottom:8px" />
      <button class="btn" id="go">เข้าสู่ระบบ</button>
      <div id="err" class="err"></div>
    </div>
  </div>
  <script>
    document.getElementById('go').onclick = async () => {
      const res = await fetch('/admin/login', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('u').value,
          password: document.getElementById('p').value,
        }),
      });
      if (!res.ok) {
        document.getElementById('err').textContent = 'เข้าสู่ระบบไม่สำเร็จ';
        return;
      }
      location.href = '/admin/dashboard';
    };
  </script>
</body>
</html>
