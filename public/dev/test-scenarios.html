<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dev Test Scenarios</title>
  <link rel="stylesheet" href="/membership/assets/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">Quota / AI scenarios</div>
    <p><a href="/dev/membership">← back</a></p>
    <div class="card">
      <button class="btn secondary" data-op="FOOD_TEXT">Consume Food Text</button>
      <button class="btn secondary" data-op="FOOD_VISION">Consume Vision</button>
      <button class="btn secondary" data-op="COMPOSITION_ADJUSTMENT">Consume Adjustment</button>
      <button class="btn secondary" data-op="COACH">Consume Coach</button>
      <button class="btn secondary" data-op="CLASSIFY">Consume Classifier</button>
      <button class="btn" id="until">Consume Until Limit (FOOD_TEXT)</button>
    </div>
    <div class="card" id="out"></div>
    <div class="card muted">
      Deterministic (must stay 0 AI after quota): วันนี้ · ประวัติ · น้ำหนัก · โปรไฟล์ · กิน 50% · กินครึ่งเดียว
    </div>
  </div>
  <script src="/membership/assets/app.js"></script>
  <script>
    async function ensureUser() {
      await api('/api/dev/identity', { method: 'POST', body: JSON.stringify({ identity: 'USER_A' }) });
    }
    document.querySelectorAll('[data-op]').forEach(b => b.onclick = async () => {
      await ensureUser();
      const out = document.getElementById('out');
      try {
        const r = await api('/api/dev/ai/consume', { method: 'POST', body: JSON.stringify({ operation: b.dataset.op }) });
        out.innerHTML = `<pre>${JSON.stringify(r,null,2)}</pre>`;
      } catch (e) {
        out.innerHTML = `<div class="err">${e.message}</div>`;
      }
    });
    document.getElementById('until').onclick = async () => {
      await ensureUser();
      const r = await fetch('/api/dev/ai/consume-until-limit', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ operation: 'FOOD_TEXT' }),
      });
      const data = await r.json();
      document.getElementById('out').innerHTML = `<div>HTTP ${r.status}</div><pre>${JSON.stringify(data,null,2)}</pre>`;
    };
  </script>
</body>
</html>
