<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>เข้าสู่ระบบ — Kcal Coach</title>
  <link rel="stylesheet" href="/membership/assets/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">Kcal Coach</div>
    <div class="sub">เข้าสู่ระบบ</div>
    <div class="card">
      <div id="status" class="muted">กำลังเข้าสู่ระบบ Kcal Coach...</div>
      <div id="err" class="err" hidden></div>
      <button class="btn" id="retry" hidden>ลองอีกครั้ง</button>
      <a class="btn secondary" href="/membership">กลับหน้าสมาชิก</a>
    </div>
  </div>
  <script src="/membership/assets/app.js"></script>
  <script>
    async function run() {
      const status = document.getElementById('status');
      const err = document.getElementById('err');
      const retry = document.getElementById('retry');
      err.hidden = true;
      retry.hidden = true;
      status.hidden = false;
      status.textContent = 'กำลังเข้าสู่ระบบ Kcal Coach...';

      const params = new URLSearchParams(location.search);
      const token = params.get('t');
      const next = params.get('next') || PROFILE_PATH;
      const safeNext =
        next.startsWith('/') && !next.startsWith('//') ? next : PROFILE_PATH;

      try {
        if (token) {
          await api('/api/membership/auth/link', {
            method: 'POST',
            body: JSON.stringify({ token }),
          });
          status.textContent = 'เข้าสู่ระบบสำเร็จ';
          location.replace(safeNext);
          return;
        }

        try {
          await api('/api/membership');
          location.replace(safeNext);
          return;
        } catch {}

        const result = await authenticateWithLiff(status);
        if (result.redirected) return;
        status.textContent = 'เข้าสู่ระบบสำเร็จ';
        location.replace(safeNext);
      } catch (e) {
        status.hidden = true;
        err.hidden = false;
        retry.hidden = false;
        err.textContent =
          e.message ||
          'ไม่สามารถเข้าสู่ระบบผ่าน LINE ได้ กรุณาลองใหม่อีกครั้ง';
      }
    }
    document.getElementById('retry').addEventListener('click', run);
    run();
  </script>
</body>
</html>
