<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kcal Coach — ประวัติ</title>
  <link rel="stylesheet" href="/membership/assets/style.css" />
  <style>
    .progress-ring { display: flex; align-items: center; gap: 16px; }
    .pct { font-size: 2.6rem; font-weight: 800; line-height: 1; color: var(--accent); }
    .bar { height: 10px; border-radius: 999px; background: #0d1611; border: 1px solid var(--border); overflow: hidden; margin-top: 10px; }
    .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
    .bar.small { height: 6px; margin-top: 6px; }
    .bar.warn > span { background: var(--warn); }
    .bar.over > span { background: var(--danger); }
    .weights { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.9rem; }
    .weights b { display: block; font-size: 1.1rem; color: var(--text); }
    .day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .day-head h3 { margin: 0; font-size: 1.05rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { font-size: 0.82rem; padding: 3px 9px; border-radius: 999px; background: #0d1611; border: 1px solid var(--border); color: var(--muted); }
    details { margin-top: 8px; }
    summary { cursor: pointer; color: var(--accent); font-size: 0.9rem; }
    .food { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    .food:last-child { border-bottom: 0; }
    .empty { opacity: 0.55; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Kcal Coach</div>
    <div class="sub">📈 ประวัติ 7 วัน</div>
    <div id="content" class="muted">กำลังเข้าสู่ระบบ Kcal Coach...</div>
  </div>
  <script src="/membership/assets/app.js"></script>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const TH_DAYS = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
    const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    const MEAL_TH = { BREAKFAST: 'เช้า', LUNCH: 'กลางวัน', DINNER: 'เย็น', SNACK: 'ว่าง', UNKNOWN: '' };

    function dayLabel(key, idx) {
      const [y, m, d] = key.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      const base = `${TH_DAYS[dt.getUTCDay()]} ${d} ${TH_MONTHS[m - 1]}`;
      return idx === 0 ? `วันนี้ · ${base}` : idx === 1 ? `เมื่อวาน · ${base}` : base;
    }
    function fmtSleep(min) {
      if (min == null) return null;
      return `${Math.floor(min / 60)}h ${min % 60}m`;
    }

    function progressCard(p) {
      if (!p) return '';
      const dirText = p.direction === 'lose' ? 'ลดไปแล้ว' : p.direction === 'gain' ? 'เพิ่มไปแล้ว' : 'ห่างจากเป้า';
      const achieved = p.direction === 'maintain' ? p.remainingKg : p.achievedKg;
      return `
        <div class="card">
          <h3 style="margin-top:0">🎯 ความสำเร็จตามเป้าหมาย</h3>
          <div class="progress-ring">
            <div class="pct">${p.percent}%</div>
            <div class="muted">${dirText} <b style="color:var(--text)">${fmtNum(achieved, 1)} kg</b>${
              p.direction !== 'maintain' && p.remainingKg > 0
                ? `<br/>อีก ${fmtNum(p.remainingKg, 1)} kg ถึงเป้า`
                : p.percent >= 100 ? '<br/>ถึงเป้าแล้ว 🎉' : ''
            }</div>
          </div>
          <div class="bar"><span style="width:${p.percent}%"></span></div>
          <div class="weights muted">
            <div>เริ่มต้น<b>${fmtNum(p.startKg, 1)} kg</b></div>
            <div style="text-align:center">ปัจจุบัน<b>${fmtNum(p.currentKg, 1)} kg</b></div>
            <div style="text-align:right">เป้าหมาย<b>${fmtNum(p.targetKg, 1)} kg</b></div>
          </div>
          <div class="row" style="margin-top:14px">
            <input class="input" id="weight" type="number" inputmode="decimal" step="0.1" min="20" max="300" placeholder="น้ำหนักวันนี้ (kg)" />
            <button class="btn" style="width:auto;margin:0" id="saveWeight">บันทึก</button>
          </div>
          <div id="weightMsg" class="muted"></div>
        </div>`;
    }

    function dayCard(d, idx, targets) {
      const target = targets?.dailyCalories || 0;
      const pct = target ? Math.round((d.calories / target) * 100) : 0;
      const barClass = !target || !d.calories ? '' : pct > 110 ? 'over' : pct < 90 ? 'warn' : '';
      const logged = d.foods.length > 0;
      const chips = [
        `🥩 โปรตีน ${fmtNum(d.proteinG)}${targets ? '/' + fmtNum(targets.dailyProteinG) : ''} g`,
        d.waterMl ? `💧 ${fmtNum(d.waterMl / 1000, 1)} L` : null,
        fmtSleep(d.sleepMinutes) ? `😴 ${fmtSleep(d.sleepMinutes)}` : null,
        d.exerciseMinutes ? `🏃 ${d.exerciseMinutes} นาที${d.exerciseKcal ? ' · ' + d.exerciseKcal + ' kcal' : ''}` : null,
        d.weightKg != null ? `⚖️ ${fmtNum(d.weightKg, 1)} kg` : null,
      ].filter(Boolean);
      return `
        <div class="card ${logged ? '' : 'empty'}">
          <div class="day-head">
            <h3>${dayLabel(d.date, idx)}</h3>
            <span class="muted">🔥 <b style="color:var(--text)">${fmtNum(d.calories)}</b>${target ? ' / ' + fmtNum(target) : ''} kcal</span>
          </div>
          ${target ? `<div class="bar small ${barClass}"><span style="width:${Math.min(100, pct)}%"></span></div>` : ''}
          <div class="chips">${chips.map((c) => `<span class="chip">${esc(c)}</span>`).join('')}</div>
          ${logged ? `
            <details>
              <summary>ดูอาหาร ${d.foods.length} รายการ</summary>
              ${d.foods.map((f) => `
                <div class="food">
                  <span>${MEAL_TH[f.mealType] ? `<span class="muted">${MEAL_TH[f.mealType]} · </span>` : ''}${esc(f.name)}</span>
                  <span class="muted">${fmtNum(f.calories)} kcal</span>
                </div>`).join('')}
            </details>` : '<div class="muted" style="margin-top:6px">ยังไม่ได้บันทึกอาหาร</div>'}
        </div>`;
    }

    async function load() {
      const el = document.getElementById('content');
      try {
        const m = await ensureMembershipSession(el);
        if (!m) return; // LIFF redirect in progress
        const h = await api('/api/membership/history');
        if (!h.hasProfile) {
          el.className = '';
          el.innerHTML = `<div class="card"><h3>ยังไม่มีเป้าหมาย</h3><p class="muted">ตั้งค่าโปรไฟล์ในแชท LINE โดยพิมพ์ <b>เริ่ม</b> แล้วกลับมาดูประวัติได้เลยครับ</p></div>`;
          return;
        }
        el.className = '';
        el.innerHTML = progressCard(h.progress) + h.days.map((d, i) => dayCard(d, i, h.targets)).join('') +
          `<a class="btn secondary" href="/profile">ไปหน้าโปรไฟล์</a>`;
        document.getElementById('saveWeight')?.addEventListener('click', async () => {
          const msg = document.getElementById('weightMsg');
          const kg = Number(document.getElementById('weight').value);
          if (!kg) { msg.className = 'err'; msg.textContent = 'ใส่น้ำหนักก่อนครับ'; return; }
          try {
            await api('/api/membership/weight', { method: 'POST', body: JSON.stringify({ weightKg: kg }) });
            msg.className = 'ok'; msg.textContent = `บันทึก ${fmtNum(kg, 1)} kg แล้ว`;
            setTimeout(load, 500);
          } catch (e) {
            if (redirectToLoginIfUnauthorized(e)) return;
            msg.className = 'err'; msg.textContent = e.message;
          }
        });
      } catch (e) {
        if (redirectToLoginIfUnauthorized(e)) return;
        el.className = 'err';
        el.textContent = e.message;
      }
    }
    load();
  </script>
</body>
</html>
