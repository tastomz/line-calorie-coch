<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สมัคร Pro</title>
  <link rel="stylesheet" href="/membership/assets/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">สมัคร Tastom Pro</div>
    <div class="card">
      <h3 style="margin-top:0">เลือกแพ็กเกจ</h3>
      <p class="muted">ใช้งาน AI ได้มากขึ้น · จ่ายผ่าน QR พร้อมเพย์</p>
      <div id="plans"></div>
      <div id="msg" class="muted"></div>
      <a class="btn secondary" href="/account">กลับบัญชี</a>
    </div>
  </div>
  <script src="/membership/assets/app.js"></script>
  <script>
    (async () => {
      const msg = document.getElementById('msg');
      try {
        await api('/api/membership');
      } catch (e) {
        if (redirectToLoginIfUnauthorized(e)) return;
        msg.className = 'err';
        msg.textContent = e.message;
        return;
      }
      renderPlanPicker(document.getElementById('plans'));
    })();
  </script>
</body>
</html>
