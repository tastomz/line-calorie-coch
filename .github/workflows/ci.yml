name: CI

on:
  push:
    branches: [main, develop, sit, uat, prd, 'improvement/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma validate

      - name: Validate PostgreSQL schema (no DB connection)
        run: npx prisma validate --schema prisma/postgres/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/kcal_coach_ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm test -- --ci --runInBand

      - run: npm run build

      - name: Check backend working tree unchanged
        run: git diff --exit-code

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check frontend working tree unchanged
        run: git diff --exit-code

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production backend dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit production frontend dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
